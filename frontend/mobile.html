<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Capture & Share</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="mobile-page">
    <div class="container">
        <header class="header">
            <div class="logo">
                <div class="logo-icon">📸</div>
                <h1>Capture & Share</h1>
            </div>
            <p class="subtitle">Take a photo and share it live!</p>
        </header>

        <main class="main-content">
            <!-- Preview Area -->
            <div class="preview-container" id="previewContainer">
                <div class="preview-placeholder" id="placeholder">
                    <div class="placeholder-icon">🖼️</div>
                    <p>Your photo will appear here</p>
                </div>
                <img id="imagePreview" class="image-preview hidden" alt="Preview">
            </div>

            <!-- Capture Button -->
            <div class="capture-section">
                <input type="file" id="fileInput" accept="image/*" capture="environment" hidden>
                <button class="capture-btn" id="captureBtn">
                    <span class="btn-icon">📷</span>
                    <span>Capture Image</span>
                </button>
            </div>

            <!-- Submit Button -->
            <button class="submit-btn hidden" id="submitBtn">
                <span class="btn-icon">🚀</span>
                <span>Submit Photo</span>
            </button>

            <!-- Status Messages -->
            <div class="status-container hidden" id="statusContainer">
                <div class="status-message" id="statusMessage"></div>
            </div>
        </main>

        <!-- Connection Status -->
        <footer class="footer">
            <div class="connection-status" id="connectionStatus">
                <span class="status-dot disconnected"></span>
                <span>Connecting...</span>
            </div>
        </footer>
    </div>

    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/mobile.js"></script>
</body>
</html>
