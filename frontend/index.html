<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Capture & Upload</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --error: #ef4444;
            --bg-dark: #0f0f1a;
            --bg-card: rgba(255, 255, 255, 0.05);
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16162a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 8px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .preview-container {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            aspect-ratio: 4/3;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .placeholder {
            color: var(--text-secondary);
        }

        .placeholder-icon {
            font-size: 3rem;
            opacity: 0.5;
            margin-bottom: 8px;
        }

        .preview-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .preview-img.show {
            display: block;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 32px;
            border: none;
            border-radius: 50px;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 12px;
        }

        .btn-capture {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 0 40px rgba(99, 102, 241, 0.3);
        }

        .btn-capture:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 60px rgba(99, 102, 241, 0.5);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            color: white;
            display: none;
        }

        .btn-submit.show {
            display: inline-flex;
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-icon {
            font-size: 1.2rem;
        }

        .status {
            padding: 12px 20px;
            border-radius: 12px;
            margin-top: 16px;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.info {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
        }

        .status.success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .status.error {
            background: rgba(239, 68, 68, 0.2);
            color: var(--error);
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">📸</div>
        <h1>Capture & Upload</h1>
        <p class="subtitle">Take a photo and upload to cloud</p>

        <div class="preview-container">
            <div class="placeholder" id="placeholder">
                <div class="placeholder-icon">🖼️</div>
                <p>Your photo will appear here</p>
            </div>
            <img id="preview" class="preview-img" alt="Preview">
        </div>

        <input type="file" id="fileInput" accept="image/*" capture="environment">

        <button class="btn btn-capture" id="captureBtn">
            <span class="btn-icon">📷</span>
            <span>Capture Image</span>
        </button>

        <button class="btn btn-submit" id="submitBtn">
            <span class="btn-icon">🚀</span>
            <span>Upload Photo</span>
        </button>

        <div class="status" id="status"></div>
    </div>

    <script>
        // Cloudinary Config
        const CLOUD_NAME = 'derb7wswl';
        const UPLOAD_PRESET = 'web123';

        // DOM Elements
        const fileInput = document.getElementById('fileInput');
        const captureBtn = document.getElementById('captureBtn');
        const submitBtn = document.getElementById('submitBtn');
        const preview = document.getElementById('preview');
        const placeholder = document.getElementById('placeholder');
        const status = document.getElementById('status');

        let selectedFile = null;

        // Capture button click
        captureBtn.addEventListener('click', () => fileInput.click());

        // File selected
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.src = e.target.result;
                    preview.classList.add('show');
                    placeholder.style.display = 'none';
                    submitBtn.classList.add('show');
                    hideStatus();
                };
                reader.readAsDataURL(file);
            }
        });

        // Submit button click
        submitBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="btn-icon">⏳</span><span>Uploading...</span>';
            showStatus('Uploading to cloud...', 'info');

            try {
                const formData = new FormData();
                formData.append('file', selectedFile);
                formData.append('upload_preset', UPLOAD_PRESET);

                const response = await fetch(
                    `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
                    { method: 'POST', body: formData }
                );

                if (!response.ok) throw new Error('Upload failed');

                const data = await response.json();
                showStatus('✅ Photo uploaded successfully!', 'success');

                // Reset after 2 seconds
                setTimeout(resetForm, 2000);

            } catch (error) {
                console.error('Upload failed:', error);
                showStatus('❌ Upload failed. Please try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span class="btn-icon">🚀</span><span>Upload Photo</span>';
            }
        });

        function showStatus(message, type) {
            status.textContent = message;
            status.className = `status show ${type}`;
        }

        function hideStatus() {
            status.classList.remove('show');
        }

        function resetForm() {
            selectedFile = null;
            fileInput.value = '';
            preview.classList.remove('show');
            placeholder.style.display = 'block';
            submitBtn.classList.remove('show');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span class="btn-icon">🚀</span><span>Upload Photo</span>';
            hideStatus();
        }
    </script>
</body>

</html>
